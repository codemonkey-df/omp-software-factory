[project]
name = "omp-sw-factory"
version = "0.1.0"
description = "Dev tooling for the omp-sw-factory OMP plugin (the helper itself is stdlib-only)."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["skills/factory/scripts/factory.py"]
